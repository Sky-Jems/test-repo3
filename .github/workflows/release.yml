name: Release Microservices

# on:
#   release:
#     types: [published]
on:
  push:
    tags:
      - '*' 

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 24
      uses: actions/setup-java@v3
      with:
        java-version: '24'
        distribution: 'temurin'
        cache: 'maven'

    - name: Make build script executable
      run: chmod +x ./build-all-services.sh

    - name: Build all microservices
      run: ./build-all-services.sh

    - name: Verify JAR files were created
      run: |
        echo "Checking for JAR files in jar-releases directory"
        if [ -d "jar-releases" ] && [ "$(ls -A jar-releases)" ]; then
          echo "JAR files found:"
          ls -la jar-releases
          echo "Build successful!"
        else
          echo "No JAR files found in jar-releases directory"
          echo "Build failed!"
          exit 1
        fi

    - name: Zip built JARs
      run: zip -r jar-releases.zip jar-releases

    - name: Upload Zip file containing jar files
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        files: jar-releases.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
